<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Idle Physics Game</title>
  <link rel="stylesheet" href="style/base.css" />
  <link rel="stylesheet" href="style/layout.css" />
  <link rel="stylesheet" href="style/ui.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="world"></canvas>
    <div id="overlay"></div>

    <div id="ui-panel" class="hidden">
      <div id="points">Points: 0</div>
      <div id="upgrades"></div>
      <div id="debug"></div>
    </div>

    <button id="settings-btn">⚙️</button>
    <div id="settings-panel" class="hidden">
      <button id="reset-btn">Reset Game</button>
    </div>
  </div>

  <script type="module" src="scripts/physics.js"></script>
  <script type="module" src="scripts/upgrades.js"></script>
  <script type="module" src="scripts/ui.js"></script>
  <script type="module" src="scripts/save.js"></script>
  <script type="module" src="scripts/settings.js"></script>
  <script type="module" src="scripts/game.js"></script>
</body>
</html>
